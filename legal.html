<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=https://www.wintellex.com/privacy">
<link rel="canonical" href="https://www.wintellex.com/privacy">
<meta name="robots" content="noindex,follow">
<title>Wintellex — Redirecting…</title>
<link rel="icon" href="https://f4106b695ee260aafd87fdcf0205d09d.cdn.bubble.io/f1784265877394x297713569489143500/Win%202.png" type="image/png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:linear-gradient(160deg,#0d0a19 0%,#170f2b 100%);
    color:#f0ecfb;
    font-family:'Inter',system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .wrap{ padding:24px; }
  .spinner{
    width:34px;height:34px;margin:0 auto 22px;
    border-radius:50%;
    border:3px solid rgba(139,92,255,0.25);
    border-top-color:#8b5cff;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  p{ font-size:15px; color:#b8aed4; }
  a{ color:#b785ff; text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>Redirecting you to our Privacy Policy&hellip;</p>
    <p style="margin-top:10px;font-size:13px;">
      If you are not redirected automatically,
      <a href="https://www.wintellex.com/privacy">click here</a>.
    </p>
  </div>
  <script>
    window.location.replace("https://www.wintellex.com/privacy");
  </script>
</body>
</html>
